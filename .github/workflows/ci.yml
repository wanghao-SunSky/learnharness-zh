name: Chinese edition checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: NODE_ENV=test node --import tsx --test tests/render-cards.test.tsx tests/render-composer.test.tsx tests/render-graph-chrome.test.tsx tests/render-minimal-home.test.tsx tests/render-new-session.test.tsx tests/render-phase-divider.test.tsx tests/render-plan-block.test.tsx tests/render-sidebar.test.tsx tests/settings-pure.test.ts
      - run: npm ci --prefix acp
      - run: npm run --prefix acp build
      - run: npm test --prefix acp
