extends: ./electron-builder.yml
appId: local.learnharness.personal
productName: LearnHarness Personal
directories:
  output: dist-personal
mac:
  icon: build/icon.icns
  identity: null
  notarize: false
  extraResources:
    - from: electron/server-title-guard.cjs
      to: server-title-guard.cjs
    - from: acp
      to: acp
      filter:
        - bridge.mjs
        - core.mjs
        - learnharness-acp
    - from: LICENSE
      to: licenses/LICENSE
  electronLanguages:
    - en
    - zh_CN
publish: null
